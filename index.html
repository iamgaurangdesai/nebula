<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GenLayer Clipping Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Outfit:wght@700&display=swap">
<style>
/* Layout: app shell with a left rail (Nebula / GenLayer) and a single dashboard column: banner, stat cards, highlight cards, leader bars, chip wall, top clips, leaderboard. One light look on purpose. */
:root{
  color-scheme:light;
  --background:lab(98.837 -0.443995 -1.43219);
  --foreground:lab(8.23114 -1.15353 -10.5419);
  --muted:lab(96.5136 -0.878394 -2.85889);
  --muted-foreground:lab(44.2722 -2.16639 -8.89328);
  --border:lab(90.7116 -1.09041 -3.56942);
  --card:#ffffff;
  --rail-bg:oklab(0.969998 -0.00274572 -0.00749445 / 0.2);
  --rail-border:oklab(0.919998 -0.00342914 -0.00937498 / 0.6);
  --fg5:oklab(0.209998 -0.00776664 -0.0289716 / 0.05);
  --brand:#3056f5;
  --brand-2:#4a72ff;
  --brand-deep:#1f43d6;
  --brand-ink:#1d3cc0;
  --brand-soft:lab(42.5577 33.018 -84.8336 / 0.12);
  --brand-line:oklab(0.53471 -0.0132097 -0.23957 / 0.22);
  --brand-shadow:0 1px 2px #0f172a0d;
  --font-sans:"Geist","Geist Fallback",system-ui,sans-serif;
  --brand-font:"Outfit","Outfit Fallback",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--background)}
body{margin:0;color:var(--foreground);font-family:var(--font-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--background)}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{display:flex;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;width:240px;flex:none;border-right:1px solid var(--rail-border);background:var(--rail-bg);display:none}
.rail-in{display:flex;height:100%;flex-direction:column;gap:24px;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:10px;padding:8px 8px 0;text-decoration:none}
.logo .mark{display:flex;width:36px;height:36px;flex:none;align-items:center;justify-content:center;border-radius:8px;background:var(--fg5);padding:4px}
.logo .mark img{width:100%;height:100%;object-fit:contain;border-radius:6px;display:block}
.logo b{font-size:16px;font-weight:600;letter-spacing:-.025em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav span{display:flex;align-items:center;gap:12px;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:500;background:var(--fg5)}
.nav svg{width:16px;height:16px}
.client{margin-top:auto;display:flex;align-items:center;gap:10px;border-top:1px solid var(--rail-border);padding:16px 8px 0}
.client .mark{display:flex;width:32px;height:32px;flex:none;align-items:center;justify-content:center;border-radius:999px;background:#fff;border:1px solid var(--border);padding:6px}
.client .mark img{width:100%;height:100%;object-fit:contain;display:block}
.client b{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col{display:flex;min-width:0;flex:1;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rail-border);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.topbar .mark{display:flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:6px;background:var(--fg5);padding:3px}
.topbar .mark img{width:100%;height:100%;object-fit:contain;border-radius:5px;display:block}
.topbar b{font-size:14px;font-weight:600;letter-spacing:-.025em}
.topbar .x{color:var(--muted-foreground);font-size:13px}
.topbar .gl{width:18px;height:18px;object-fit:contain}
@media (min-width:1024px){.rail{display:block}.topbar{display:none}}

.shell{width:100%;max-width:1024px;margin:0 auto;padding-block:28px 72px;padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px))}
.banner,.subheader,.stats,.highlights,.section{max-width:1100px;margin-left:auto;margin-right:auto}

.banner{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;border-radius:16px;color:#fff;box-shadow:var(--brand-shadow);
  background:repeating-radial-gradient(circle at 115% 125%,#ffffff12 0 1px,transparent 1px 26px),linear-gradient(135deg,var(--brand-deep) 0%,var(--brand) 45%,var(--brand-2) 100%)}
.banner::after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 55%,rgba(0,0,0,.2))}
.banner strong{position:relative;z-index:1;font-family:var(--brand-font);font-weight:700;letter-spacing:-.04em;font-size:clamp(36px,6vw,72px);line-height:.9;text-align:center}
.banner span{position:relative;z-index:1;margin-top:18px;font-size:13px;letter-spacing:.03em;color:rgba(255,255,255,.86);text-align:center}

.subheader{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px 0;font-size:13px;line-height:19.5px;color:var(--muted-foreground)}
.subheader p{margin:0}
.subheader time{font-variant-numeric:tabular-nums;white-space:nowrap}

.stats,.highlights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.stat{display:flex;flex-direction:column;gap:8px;min-width:0;padding:20px 22px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--brand-shadow)}
.stat span{font-size:13px;font-weight:500;line-height:19.5px;color:var(--muted-foreground)}
.stat strong{font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat strong.blue{color:var(--brand)}
.hl{display:flex;flex-direction:column;gap:4px;min-width:0;padding:16px 20px;background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:14px}
.hl span{font-size:12px;font-weight:600;line-height:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink)}
.hl strong{font-size:22px;font-weight:600;line-height:1.5;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hl small{font-size:13px;line-height:19.5px;color:var(--muted-foreground);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.section{margin-top:40px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:12px;font-weight:600;line-height:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.sh h2{margin:4px 0 0;font-size:20px;font-weight:600;line-height:30px;letter-spacing:-.01em}
.meta{font-size:13px;line-height:19.5px;color:var(--muted-foreground);white-space:nowrap}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--brand-shadow)}
.chart{padding:20px 22px 14px}
.leaders{display:grid;gap:14px;padding:4px 0 6px}
.leader{display:grid;grid-template-columns:170px minmax(0,1fr) 76px;gap:14px;align-items:center;text-decoration:none}
.lname{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:500;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;border-radius:999px;background:var(--brand-soft);overflow:hidden}
.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand-deep),var(--brand-2))}
.leader strong{text-align:right;font-size:14px;font-weight:600;line-height:21px;font-variant-numeric:tabular-nums}
.leader strong small{display:block;font-size:11px;font-weight:400;line-height:16.5px;color:var(--muted-foreground)}

.av{display:inline-flex;width:22px;height:22px;flex:0 0 auto;align-items:center;justify-content:center;border-radius:999px;overflow:hidden;background:var(--brand-soft);color:var(--brand-ink);font-size:11px;font-weight:600;line-height:1;object-fit:cover}

.wall{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.wtrack{display:flex;gap:10px;width:max-content;animation:wall 60s linear infinite}
.wall:hover .wtrack{animation-play-state:paused}
@keyframes wall{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.chip{display:inline-flex;flex:0 0 auto;align-items:center;gap:8px;padding:8px 14px 8px 6px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-size:14px;font-weight:500;line-height:21px;white-space:nowrap;text-decoration:none}

.topgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.top{overflow:hidden;min-width:0}
.th{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--border)}
.rank{display:flex;align-items:center;justify-content:center;height:22px;padding:0 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);font-size:12px;font-weight:600;line-height:18px;flex:none}
.th a{min-width:0;font-size:14px;font-weight:600;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.th a:hover{color:var(--brand-ink)}
.th strong{margin-left:auto;font-size:13px;font-weight:600;line-height:19.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.th strong small{font-size:13px;font-weight:400;color:var(--muted-foreground)}
.tv{padding:12px}
.frame{position:relative;display:block;height:300px;border-radius:12px;overflow:hidden;background:var(--muted);text-decoration:none}
.frame .bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);max-width:none;object-fit:cover;filter:blur(18px) saturate(1.1);opacity:.55}
.frame .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.play{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(15,23,42,.62);display:grid;place-items:center;transition:background .15s}
.play svg{width:20px;height:20px;margin-left:3px;fill:#fff}
.frame:hover .play{background:var(--brand)}
.onx{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--foreground);font-size:12px;font-weight:500;line-height:18px}
.frame .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted-foreground);font-size:13px}
.tw{display:flex;flex-direction:column;gap:12px;padding:14px 16px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;color:#0f1419;font-size:15px;line-height:20px}
.tw-h{display:flex;align-items:center;gap:10px;min-width:0}
.tw-h .av{width:40px;height:40px;font-size:15px}
.tw-id{display:flex;flex-direction:column;min-width:0;flex:1;line-height:18px}
.tw-id b{display:flex;align-items:center;gap:3px;min-width:0;font-weight:700;font-size:15px}
.tw-id b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-id b svg{width:17px;height:17px;flex:none;fill:#1d9bf0}
.tw-id small{font-size:14px;color:#536471;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-x{width:20px;height:20px;flex:none;color:#0f1419}
.tw-t{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.tw-t a{color:#1d9bf0;text-decoration:none}
.tw-t a.more{white-space:nowrap}
.tw .frame{height:auto;aspect-ratio:16/9;border-radius:14px;border:1px solid #cfd9de}
.tw .frame .fg{object-fit:cover}
.tw-d{font-size:14px;color:#536471}
.tw-f{display:flex;align-items:center;gap:18px;padding-top:10px;border-top:1px solid #eff3f4;font-size:14px;font-weight:600;color:#536471}
.tw-f span{display:inline-flex;align-items:center;gap:6px}
.tw-f svg{width:18px;height:18px}
.tw-f .lk svg{fill:#f91880}
.tw-f .lk{color:#0f1419}
.tw-f a{margin-left:auto;color:#1d9bf0;text-decoration:none;font-weight:600}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cgroup{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--muted);max-width:100%;overflow-x:auto;scrollbar-width:none}
.cgroup button{white-space:nowrap;flex:none}
.cgroup button{height:30px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted-foreground);font:inherit;font-size:13px;font-weight:500;line-height:19.5px;cursor:pointer}
.cgroup button[aria-pressed="true"]{background:#fff;color:var(--brand-ink);box-shadow:0 1px 2px #0f172a14}
.table{overflow:hidden}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) 130px 110px 24px;gap:12px;align-items:center;min-height:56px;padding:0 18px;border-top:1px solid var(--border);font-size:14px;text-decoration:none;color:var(--foreground);transition:background-color .12s}
.row.head{min-height:40px;border-top:0;background:var(--muted);color:var(--muted-foreground);font-size:12px;font-weight:500}
a.row:hover{background:color-mix(in oklab,var(--brand) 6%,var(--card))}
a.row:hover svg{color:var(--brand)}
.rk{font-size:13px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.acc{display:flex;flex-direction:column;gap:6px;min-width:0;font-weight:500;padding-block:8px}
.acc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc small{margin-top:-4px;font-size:12px;font-weight:400;color:var(--muted-foreground)}
.acc i{display:block;height:3px;border-radius:999px;background:var(--brand);opacity:.8;max-width:100%}
.acc i.p{background:#94a3b8}
.acc i.r{background:#e5484d;opacity:.55}
.acc em{display:inline-flex;align-items:center;gap:6px;margin-top:-4px;font-style:normal;font-size:12px;font-weight:500;line-height:16px}
.acc em::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.acc em.a{color:var(--brand-ink)}
.acc em.p{color:var(--muted-foreground)}
.acc em.r{color:#c4292e}
.cgroup button span{margin-left:6px;font-variant-numeric:tabular-nums;opacity:.7}
.row .dt{font-size:13px;color:var(--muted-foreground)}
.row .vw{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.row .go{display:flex;justify-content:flex-end;color:var(--muted-foreground)}
.row .go svg{width:16px;height:16px}
.more{display:flex;justify-content:center}
.more button{height:36px;margin-top:16px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:var(--brand-shadow);color:var(--foreground);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.more button:hover{border-color:var(--brand);color:var(--brand-ink)}

@media (max-width:980px){.stats,.topgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .shell{padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .banner{padding:36px 16px}
  .highlights{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat strong{font-size:24px}
  .stats{gap:16px}
  .leader{grid-template-columns:minmax(0,110px) minmax(0,1fr) 64px;gap:10px}
  .topgrid{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:28px minmax(0,1fr) 76px 64px 16px;gap:8px;padding:0 12px;font-size:13px}
}
@media (max-width:420px){.stats,.highlights{gap:12px}.stat{padding:16px 16px}.hl{padding:14px 14px}.hl strong{font-size:20px}}
@media (prefers-reduced-motion:reduce){.wtrack{animation:none;flex-wrap:wrap;width:auto}}
</style>
</head>

<script>
(function(){
  const D=JSON.parse(document.getElementById('clipdata').textContent);
  const I=JSON.parse(document.getElementById('clipimgs').textContent);
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt=n=>{n=+n||0;if(Math.abs(n)>=1e6)return(n/1e6).toFixed(1)+'M';if(Math.abs(n)>=1e3)return(n/1e3).toFixed(1)+'K';return String(Math.round(n))};
  const dLong=t=>new Date(t*1000).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const dShort=iso=>{const p=iso.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})};
  const xUser=h=>'https://x.com/'+encodeURIComponent(h);
  const xPost=(h,id)=>/^\d+$/.test(id)?xUser(h)+'/status/'+id:(/^https:\/\//.test(id)?id:xUser(h));
  const av=h=>{const src=I['a:'+h.toLowerCase()];return src?`<img class="av" src="${src}" alt="">`:`<span class="av" aria-hidden="true">${esc((h.replace(/^[^a-z0-9]+/i,'')[0]||'?').toUpperCase())}</span>`};
  const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>';

  const rows=(D.rows||[]).map(r=>({h:r[0],t:r[1]*60,v:r[2],id:r[3],s:r[4]}));
  const ok=rows.filter(c=>c.s==='a');
  const SL={a:'Approved',p:'In review',r:'Rejected'};
  const accMap=new Map();
  for(const c of ok){const k=c.h.toLowerCase();let a=accMap.get(k);if(!a){a={h:c.h,v:0,n:0,t:0};accMap.set(k,a)}a.v+=c.v;a.n++;if(c.t>a.t)a.t=c.t}
  const acc=[...accMap.values()].sort((p,q)=>q.v-p.v);

  if(D.title)$('bTitle').textContent=D.title;
  try{const u=new Date(D.at);$('upd').textContent='Updated '+u.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});$('upd').dateTime=D.at}catch(e){}

  const avg=D.clips?D.views/D.clips:0;
  $('stats').innerHTML=[['Total views',fmt(D.views),'blue'],['Clips',D.clips.toLocaleString('en-US'),''],['Accounts',D.accounts.toLocaleString('en-US'),''],['Avg per clip',fmt(avg),'']]
    .map(s=>`<div class="stat"><span>${s[0]}</span><strong class="${s[2]}">${s[1]}</strong></div>`).join('');
  const top=ok[0];
  const plats=(D.plats||[]).map(p=>p==='twitter'?'X':p.charAt(0).toUpperCase()+p.slice(1));
  $('hls').innerHTML=[
    ['Biggest day',D.big&&D.big[0]?dShort(D.big[0]):'—',D.big?D.big[1]+' clips posted':''],
    ['Top post',top?fmt(top.v):'—',top?'@'+top.h:''],
    ['Combined audience',fmt(D.audience),'followers'],
    ['Platforms',String(plats.length),plats.join(', ')]
  ].map(s=>`<div class="hl"><span>${s[0]}</span><strong>${esc(s[1])}</strong><small>${esc(s[2])}</small></div>`).join('');

  const max=acc.length?acc[0].v:1;
  $('leaders').innerHTML=acc.slice(0,8).map(a=>`<a class="leader" href="${xUser(a.h)}" target="_blank" rel="noopener"><span class="lname">${av(a.h)}<em>@${esc(a.h)}</em></span><div class="track"><div class="bar" style="width:${(a.v/max*100).toFixed(4)}%"></div></div><strong>${fmt(a.v)}<small>views</small></strong></a>`).join('');

  const wall=acc.slice(0,30).map(a=>`<a class="chip" href="${xUser(a.h)}" target="_blank" rel="noopener" tabindex="-1">${av(a.h)}@${esc(a.h)}</a>`).join('');
  $('wall').innerHTML=wall+wall;

  const t3=ok.slice(0,3);
  $('topMeta').textContent=t3.length+' clips';
  $('tops').innerHTML=t3.map((c,i)=>{const th=I['t:'+c.id];const url=xPost(c.h,c.id);
    const p=I['p:'+c.id];
    const media=th?`<a class="frame" href="${url}" target="_blank" rel="noopener" aria-label="Watch @${esc(c.h)}'s clip on X"><img class="fg" src="${th}" alt=""><span class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></span></a>`:'';
    let body;
    if(p){
      const txt=esc(p.x).replace(/(^|[^\w])@(\w{1,15})/g,(m,a,u)=>`${a}<a href="${xUser(u)}" target="_blank" rel="noopener">@${u}</a>`).replace(/(^|\s)#(\w+)/g,(m,a,h)=>`${a}<a href="https://x.com/hashtag/${h}" target="_blank" rel="noopener">#${h}</a>`);
      const dt=new Date(p.d);
      const when=dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' · '+dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      body=`<div class="tw"><div class="tw-h">${av(c.h)}<div class="tw-id"><b><span>${esc(p.n)}</span>${p.b?'<svg viewBox="0 0 22 22" aria-label="Verified"><path d="M20.4 11c0-1.3-.8-2.4-1.9-2.9.4-1.2.2-2.6-.7-3.5s-2.3-1.1-3.5-.7C13.8 2.8 12.7 2 11.4 2S9 2.8 8.5 3.9c-1.2-.4-2.6-.2-3.5.7S3.9 6.9 4.3 8.1C3.2 8.6 2.4 9.7 2.4 11s.8 2.4 1.9 2.9c-.4 1.2-.2 2.6.7 3.5s2.3 1.1 3.5.7c.5 1.1 1.6 1.9 2.9 1.9s2.4-.8 2.9-1.9c1.2.4 2.6.2 3.5-.7s1.1-2.3.7-3.5c1.1-.5 1.9-1.6 1.9-2.9zm-10.6 4.4-3.7-3.7 1.4-1.4 2.3 2.3 4.9-5.3 1.5 1.4-6.4 6.7z"/></svg>':''}</b><small>@${esc(p.s)}</small></div><svg class="tw-x" viewBox="0 0 24 24" fill="currentColor" aria-label="X"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></div><p class="tw-t">${txt}${p.t?`… <a class="more" href="${url}" target="_blank" rel="noopener">Show more</a>`:''}</p>${media}<div class="tw-d">${when}</div><div class="tw-f"><span class="lk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.884 13.19c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg>${p.l.toLocaleString('en-US')}</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-.9L3 20l1.1-4A8.4 8.4 0 1 1 21 11.5z"/></svg>${p.r.toLocaleString('en-US')}</span><a href="${url}" target="_blank" rel="noopener">Watch on X ↗</a></div></div>`;
    }else{
      body=th?media.replace('class="frame"','class="frame" style="height:300px;aspect-ratio:auto"'):`<a class="frame" href="${url}" target="_blank" rel="noopener"><span class="noimg">Open post on X ↗</span></a>`;
    }
    return `<article class="card top"><div class="th"><span class="rank">#${i+1}</span><a href="${url}" target="_blank" rel="noopener">@${esc(c.h)}</a><strong>${fmt(c.v)} <small>views</small></strong></div><div class="tv">${body}</div></article>`}).join('');

  $('subm').textContent=D.clips.toLocaleString('en-US')+' submitted';
  let view='clips',shown=50,stat='';
  const cnt={a:0,p:0,r:0};for(const c of rows)cnt[c.s]++;
  $('sGroup').innerHTML=[['','All',rows.length],['a','Approved',cnt.a],['p','In review',cnt.p],['r','Rejected',cnt.r]]
    .map(s=>`<button type="button" data-s="${s[0]}" aria-pressed="${s[0]===''}">${s[1]}<span>${s[2]}</span></button>`).join('');
  $('sGroup').onclick=e=>{const b=e.target.closest('button');if(!b)return;stat=b.dataset.s;shown=50;for(const x of $('sGroup').children)x.setAttribute('aria-pressed',x===b);draw()};
  function draw(){
    const head=`<div class="row head" role="row"><span>#</span><span>Account</span><span>Posted</span><span>Views</span><span></span></div>`;
    const src=stat?rows.filter(c=>c.s===stat):rows;
    let html,list;
    if(view==='clips'){
      list=src;const m=list.length?list[0].v||1:1;
      html=list.slice(0,shown).map((c,i)=>`<a class="row" role="row" href="${xPost(c.h,c.id)}" target="_blank" rel="noopener"><span class="rk">${i+1}</span><span class="acc"><span>@${esc(c.h)}</span><em class="${c.s}">${SL[c.s]}</em><i class="${c.s}" style="width:${(c.v/m*100).toFixed(4)}%"></i></span><span class="dt">${dLong(c.t)}</span><span class="vw">${fmt(c.v)}</span><span class="go">${arrow}</span></a>`).join('');
    }else{
      const mp=new Map();
      for(const c of src){const k=c.h.toLowerCase();let a=mp.get(k);if(!a){a={h:c.h,v:0,n:0,ap:0,t:0};mp.set(k,a)}a.v+=c.v;a.n++;if(c.s==='a')a.ap++;if(c.t>a.t)a.t=c.t}
      list=[...mp.values()].sort((p,q)=>q.v-p.v);const m=list.length?list[0].v||1:1;
      html=list.slice(0,shown).map((a,i)=>`<a class="row" role="row" href="${xUser(a.h)}" target="_blank" rel="noopener"><span class="rk">${i+1}</span><span class="acc"><span>@${esc(a.h)}</span><small>${a.n} clip${a.n===1?'':'s'} · ${a.ap} approved</small><i style="width:${(a.v/m*100).toFixed(4)}%"></i></span><span class="dt">${dLong(a.t)}</span><span class="vw">${fmt(a.v)}</span><span class="go">${arrow}</span></a>`).join('');
    }
    $('table').innerHTML=head+(html||'<div class="row" style="justify-content:center;color:var(--muted-foreground)">No clips here yet.</div>');
    $('more').parentElement.hidden=list.length<=shown;
  }
  function setView(v){view=v;shown=50;$('vClips').setAttribute('aria-pressed',v==='clips');$('vAcc').setAttribute('aria-pressed',v==='accounts');draw()}
  $('vClips').onclick=()=>setView('clips');
  $('vAcc').onclick=()=>setView('accounts');
  $('more').onclick=()=>{shown+=50;draw()};
  draw();
})();
</script>

</body>
</html>
